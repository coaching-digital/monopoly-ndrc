<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Monopoly NDRC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

  :root {
    --bg-dark: #0f172a; --panel-bg: #1e293b;
    --rouge: #ef4444; --bleu: #3b82f6; --vert: #22c55e; --jaune: #f1c40f;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: white; overflow: hidden; }

  #game-container { display: flex; height: 100vh; width: 100vw; }

  #board-container {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    background: #111827; padding: 10px; margin: 0; overflow: hidden;
  }

  /* PLATEAU RECTANGULAIRE 13x9 */
  #board {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 3px;
    width: 100%;
    height: 100%;
    max-height: 98vh;
    background: #1E293B; padding: 4px; border-radius: 8px; border: 3px solid #475569;
  }

  .center-zone {
    grid-area: 2 / 2 / 9 / 13;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba (15,23,42,0.95); border-radius: 4px; 
    z-index: 1;
  }

  .game-title {
  font-size: 7vh;
  color: #FFFFFF;
  text-transform: uppercase;
  letter-spacing: 5px;
  margin-bottom: 2vh;
  font-weight: 900;
}


  .pot-display {
    background: #0f172a; padding: 2vh 3vw; border-radius: 15px; border: 3px solid #f1c40f; text-align: center; margin-top: 10px;
  }
  .pot-label { text-transform: uppercase; color: #94a3b8; font-size: 1.2rem; }
  .pot-amount { font-size: 5rem; color: #00a349; font-weight: 900; display: block; }

  /* SIDEBAR */
  #sidebar {
    width: 280px; background: #1E293B; padding: 15px; border-left: 2px solid #334155;
    display: flex; flex-direction: column; z-index: 10; flex-shrink: 0;
  }

  .dice-container {
    margin: 10px auto; width: 80px; height: 80px;
    background: white; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem; color: #1e293b; font-weight: bold;
    border: 5px solid #38bdf8; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  }
  .dice-rolling { animation: spin 0.4s infinite linear; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .game-timer-display {
    background: #1e293b; color: #ef4444; font-family: monospace; font-size: 2rem; font-weight: bold;
    padding: 10px; border-radius: 8px; text-align: center; margin-top: auto; border: 2px solid #ef4444;
  }
  .end-game-btn {
    background: #450a0a; color: #f87171; width: 100%; padding: 10px; margin-top: 10px;
    border: 1px solid #991b1b; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase;
  }

  /* CASES */
  .case {
    background: white; color: #1e293b; border-radius: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: clamp(0.7rem, 1.1vw, 1.2rem);
    font-weight: 900; text-align: center; cursor: pointer; padding: 2px; position: relative;
    border: 1px solid #94a3b8; line-height: 1; overflow: hidden;
  }
  .case.special { background: #cbd5e1; border: none; font-size: clamp(0.8rem, 1.3vw, 1.4rem); }
  .case.ms { background: var(--rouge); color: white; border: none; }
  .case.chance { background: var(--jaune); color: #333; border: none; }
  .case.commu { background: #3b82f6; color: white; border: none; }
  .case.prison { background: #475569; color: white; border: 2px solid #000; }

  .shares-container { display: flex; gap: 2px; margin-top: 4px; height: 10px; justify-content: center; width: 100%; }
  .share-slot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; border: 1px solid #334155; }

  /* TEAM CARD & BOUTON LANCER */
  .team-card { background: var(--panel-bg); padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid #444; transition: 0.3s; }
  .team-card.active { border-left-color: white; background: #334155; transform: scale(1.02); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
 

.team-cap {
  font-size: 2.2rem;
  font-weight: 900;
  margin-top: 6px;
}


  .btn-roll {
    width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color: white; font-weight: 900; cursor: pointer; font-size: 1.1rem;
    box-shadow: 0 4px 0 #0369a1, 0 8px 15px rgba(0,0,0,0.3);
    transition: all 0.1s ease;
    text-transform: uppercase; letter-spacing: 1px;
    animation: pulseActive 1.5s infinite;
  }
  .btn-roll:hover { transform: translateY(-1px); box-shadow: 0 5px 0 #0369a1, 0 10px 20px rgba(0,0,0,0.4); }
  .btn-roll:active { transform: translateY(3px); box-shadow: 0 1px 0 #0369a1; }

  @keyframes pulseActive {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.2); }
    100% { filter: brightness(1); }
  }

  .pawn { width: 34px; height: 34px; border-radius: 50%; position: absolute; border: 3px solid white; z-index: 100; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 5px 10px rgba(0,0,0,0.7); }

  /* MODALE */
  #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(5px); }
  #modal-content { background: white; color: #1e293b; padding: 40px; border-radius: 20px; width: 650px; text-align: center; position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.8); }
  .btn-action { width: 100%; padding: 20px; margin: 10px 0; border: none; border-radius: 12px; color: white; font-weight: 900; cursor: pointer; font-size: 1.3rem; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }

  .quiz-box { background:#f1f5f9; padding:20px; border-radius:12px; margin:20px 0; border-left:8px solid #38bdf8; text-align:left; font-style:italic; font-size: 1.5rem; line-height: 1.4; color: #0f172a; }
  .timer-box { font-size: 3rem; font-weight: 900; color: #ef4444; border: 5px solid #ef4444; display: inline-block; padding: 10px 30px; border-radius: 50px; margin-bottom: 20px; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  #setup-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
  .setup-container { background: #1e293b; padding: 40px; border-radius: 20px; width: 700px; border: 3px solid #38bdf8; text-align: center; }
  .student-badge { background: #3b82f6; color: white; padding: 10px 30px; border-radius: 50px; font-size: 1.8rem; margin-bottom: 20px; display: inline-block; font-weight: bold; border: 3px solid white; }
  .hidden { display: none !important; }

  /* NOUVEL OVERLAY THEME */
  #theme-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
  /* LIQUIDATION : cases sélectionnées */
  .case.liquidation-pick {
    outline: 4px solid #f59e0b;
    box-shadow: 0 0 0 3px rgba(245,158,11,0.25);
  }
textarea {
  font-size: 1.3rem;
  font-weight: 700;
  padding: 12px;
}
</style>
  </head>
<body>

<div id="setup-overlay">
  <div class="setup-container">
    <h1 style="color:#FFFFFF; margin-top:0; font-size:3rem;">MONOPOLY NDRC</h1>
    <div style="text-align:left; display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
     <div>
  <label style="color:#ef4444; font-size:1.8rem; font-weight:900;">🟥 ROUGE</label>
  <textarea id="input-rouge" style="width:100%;height:60px;"></textarea>
</div>

<div>
  <label style="color:#3b82f6; font-size:1.8rem; font-weight:900;">🟦 BLEUE</label>
  <textarea id="input-bleu" style="width:100%;height:60px;"></textarea>
</div>

<div>
  <label style="color:#22c55e; font-size:1.8rem; font-weight:900;">🟩 VERTE</label>
  <textarea id="input-vert" style="width:100%;height:60px;"></textarea>
</div>

<div>
  <label style="color:#f1c40f; font-size:1.8rem; font-weight:900;">🟨 JAUNE</label>

</div>
      </div>
    <button onclick="window.initGame()" style="background:#22c55e; color:white; padding:15px 50px; font-size:1.8rem; font-weight:900; border-radius:50px; cursor:pointer; margin-top:25px; border:none;">C'EST PARTI ! 🚀</button>
  </div>
</div>

<!-- NOUVEL ECRAN : CHOIX DU THEME -->
<div id="theme-overlay" class="hidden">
  <div class="setup-container">
    <h1 style="color:#FFFFFF; margin-top:0; font-size:2.2rem;">Choisir le thème de la partie</h1>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      <button class="btn-action" style="background:#3b82f6" onclick="window.selectTheme('communication.csv','Communication digitale')">Communication digitale</button>
      <button class="btn-action" style="background:#22c55e" onclick="window.selectTheme('ecommerce.csv','E-commerce')">E-commerce</button>
      <button class="btn-action" style="background:#f59e0b" onclick="window.selectTheme('crc.csv','Centre de relation client')">Centre de relation client</button>
      <button class="btn-action" style="background:#a855f7" onclick="window.selectTheme('wordpress.csv','WordPress')">WordPress</button>
      <button class="btn-action" style="background:#ef4444" onclick="window.selectTheme('prestashop.csv','PrestaShop')">PrestaShop</button>
      <button class="btn-action" style="background:#0ea5e9" onclick="window.selectTheme('programme-entier-ndrc.csv','100% NDRC')">100% NDRC</button>
    </div>

  
  </div>
</div>

<div id="game-container">
  <div id="board-container"><div id="board"><div class="center-zone"><div class="game-title">MONOPOLY NDRC</div><div class="pot-display"><div class="pot-label">Cagnotte communauté</div><span class="pot-amount" id="pot-amount">0 €</span></div></div></div></div>

  <div id="sidebar">
  
    <div id="team-status-container"></div>
    <div style="text-align:center; margin:10px 0;"><div id="visual-dice" class="dice-container">🎲</div></div>

    <div style="margin-top:auto;">
     

      <div class="game-timer-display" id="global-timer">01:00:00</div>
      <button class="end-game-btn" onclick="window.finishGame()">🏁 FINIR LA PARTIE</button>
      <p style="text-align:center; color:#FFFFFF; margin-top:10px;">Au tour de : <b id="current-team-display" style="color:white;">-</b></p>
    </div>
  </div>
</div>

<div id="modal-overlay" class="hidden">
  <div id="modal-content">
    <button onclick="window.closeModal()" style="font-size:3rem; position:absolute; top:10px; right:20px; background:none; border:none; color:#94a3b8; cursor:pointer;">&times;</button>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
  window.teams = [
    { name: "Rouge", color: "#ef4444", pos: 0, capital: 10000, prison: 0, players: [], debt: 0,
debtInstallment: 0,
hasUsedCredit: false,
eliminated: false,
     skipNextTurn: false,
 },
    { name: "Bleu", color: "#3b82f6", pos: 0, capital: 10000, prison: 0, players: [], debt: 0,
debtInstallment: 0,
hasUsedCredit: false,
eliminated: false,
     skipNextTurn: false,
},
    { name: "Vert", color: "#22c55e", pos: 0, capital: 10000, prison: 0, players: [],  debt: 0,
debtInstallment: 0,
hasUsedCredit: false,
eliminated: false,
     skipNextTurn: false,
 },
    { name: "Jaune", color: "#f1c40f", pos: 0, capital: 10000, prison: 0, players: [], debt: 0,
debtInstallment: 0,
hasUsedCredit: false,
eliminated: false,
     skipNextTurn: false,
}
  ];
  // 📊 Statistiques pédagogiques
window.studentStats = {};
window.lastStudent = null;
  // 🎒 Sac de tirage équitable par équipe
window.studentBags = {};

  window.initGame = () => {
    ['input-rouge', 'input-bleu', 'input-vert', 'input-jaune'].forEach((id, idx) => {
      const names = document.getElementById(id).value.split(',').map(n => n.trim()).filter(n => n !== "");
      window.teams[idx].players = names.length > 0 ? names : [`Équipe ${window.teams[idx].name}`];
    });

    // On garde l'écran joueurs tel quel, puis on affiche l'écran de thème
    document.getElementById('setup-overlay').style.display = 'none';
    document.getElementById('theme-overlay').classList.remove('hidden');
// Initialisation des stats étudiants
window.studentStats = {};

// 🎒 Initialisation des sacs de tirage équitable
window.studentBags = {};

window.teams.forEach((team, idx) => {
  window.studentBags[idx] = [...team.players];
});

window.teams.forEach(team => {
  team.players.forEach(player => {
    const name = player.toUpperCase();
    window.studentStats[name] = { correct: 0, total: 0 };
  });
});
    window.updateUI();
  };

 function getRandomStudent(teamIdx) {

  // Si le sac n'existe pas ou est vide → on le reconstruit
  if (!window.studentBags[teamIdx] || window.studentBags[teamIdx].length === 0) {
    window.studentBags[teamIdx] = [...window.teams[teamIdx].players];
  }

  const bag = window.studentBags[teamIdx];

  // On tire un élève au hasard dans le sac
  const randomIndex = Math.floor(Math.random() * bag.length);
  const student = bag.splice(randomIndex, 1)[0];

  return student.toUpperCase();
}

  // ============================================================
  // QUESTIONS : chargement CSV (selon thème choisi)
  // ============================================================

  let QUESTIONS_CSV_URL = null;  // défini au moment du thème
  let currentThemeName = "";

  let questionBank = [];
  let availableQuestions = [];
  let questionsReady = false;

  function parseCsvOneColumn(text) {
    const lines = (text || "").split(/\r?\n/).filter(l => l.trim() !== "");
    if (lines.length === 0) return [];

    function decodeCell(line) {
      let s = line.trim();
      if (s.startsWith('"')) {
        if (s.endsWith('"')) s = s.slice(1, -1);
        s = s.replace(/""/g, '"');
      }
      return s.trim();
    }

    const header = decodeCell(lines[0]).toLowerCase();
    const start = header.includes("question") ? 1 : 0;

    const qs = [];
    for (let i = start; i < lines.length; i++) {
      const q = decodeCell(lines[i]);
      if (q) qs.push(q);
    }
    return qs;
  }

  function rebuildBag() {
    availableQuestions = [...questionBank];
  }

  async function refreshQuestionsInternal(showAlert) {
    try {
      if (!QUESTIONS_CSV_URL) throw new Error("Thème non sélectionné");

      const url = `${QUESTIONS_CSV_URL}?v=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const qs = parseCsvOneColumn(text);

      if (!qs.length) throw new Error("CSV vide ou invalide");

      questionBank = qs;
      rebuildBag();
      questionsReady = true;

     // (popup supprimé)

    } catch (e) {
      questionsReady = false;
      console.warn("Impossible de charger le CSV de questions", e);
      if (showAlert) alert("⚠️ Impossible de charger le CSV (thème non choisi ou fichier absent/vide).");
    }
  }


  window.selectTheme = async (fileName, displayName) => {
    QUESTIONS_CSV_URL = "./" + fileName;
    currentThemeName = displayName;

    await refreshQuestionsInternal(true);

    // On ferme l'overlay thème, on arrive au plateau
    document.getElementById('theme-overlay').classList.add('hidden');
    window.updateUI();
  };

  function getUniqueQuestion() {
    if (!questionsReady || questionBank.length === 0) return null;
    if (availableQuestions.length === 0) rebuildBag();
    return availableQuestions.splice(Math.floor(Math.random() * availableQuestions.length), 1)[0];
  }

  function ensureQuestionOrPrompt() {
  const q = getUniqueQuestion();
  if (q) return q;

  const extra = !QUESTIONS_CSV_URL
    ? `<p style="color:#64748b;margin-top:10px;">Choisis d'abord un <b>thème</b>.</p>
       <button class="btn-action" style="background:#0f172a;color:white" onclick="document.getElementById('theme-overlay').classList.remove('hidden')">🎯 CHOISIR UN THÈME</button>`
    : `<p style="color:#64748b;margin-top:10px;">CSV vide / non chargé pour <b>${currentThemeName}</b>.</p>
       <button class="btn-action" style="background:#0f172a;color:white" onclick="window.location.reload()">🔄 RECHARGER</button>`;

  window.openModal("📥 QUESTIONS INDISPONIBLES", `
    <p style="font-size:1.5rem">Impossible d'afficher une question.</p>
    ${extra}
    <button class="btn-action" style="background:#64748b" onclick="window.closeModal()">OK</button>
  `);
  return null;
}
  // ============================================================
  // LIQUIDATION OPTIONNELLE (seuil 500€) - VENTE DES PARTS À 50%
  // ============================================================

  window.liquidationMode = false;
  window.liquidationTeamIdx = null;
  window.liquidationSelected = new Set(); // positions sélectionnées

  function teamOwnedPositions(teamIdx) {
    const res = [];
    for (let pos = 0; pos < window.corporateShares.length; pos++) {
      const shares = window.corporateShares[pos];
      const count = shares.filter(x => x === teamIdx).length;
      if (count > 0) res.push({ pos, count });
    }
    return res;
  }
// ============================================================
// FAILLITE / LIQUIDATION BLOQUANTE
// ============================================================
window.liquidationMode = false;          // true = on est en phase vente
window.liquidationTeamIdx = null;        // équipe concernée
window.liquidationAwaitPick = false;     // true = l'équipe doit cliquer une case
window._turnPromptShownFor = null;       // évite de ré-afficher la popup 50 fois

function isBankrupt(idx) {
  return window.teams[idx].capital <= 0;
}

function startBankruptcyTurn(teamIdx) {
   const owned = teamOwnedPositions(teamIdx);

  // 🔥 Si aucune part restante → crédit immédiat
  if (owned.length === 0) {
    window.triggerForcedCredit(teamIdx);
    return;
  }
  window.liquidationMode = true;
  window.liquidationTeamIdx = teamIdx;
  window.liquidationAwaitPick = false;

  window.openModal("💥 FAILLITE", `
    <p style="font-size:1.6rem;font-weight:900;color:#ef4444;margin-bottom:10px;">
      Vous êtes en faillite.
    </p>
    <p style="font-size:1.2rem;color:#334155;margin-bottom:20px;">
      Vendez des parts pour continuer à jouer.
    </p>
    <button class="btn-action" style="background:var(--vert)" onclick="window.beginLiquidationPick()">
      ✅ VENDRE DES PARTS
    </button>
    <p style="color:#64748b;margin-top:10px;font-size:1rem;">
      (Vous devrez cliquer une entreprise où vous possédez des parts.)
    </p>
  `);
}

window.beginLiquidationPick = () => {
  window.liquidationAwaitPick = true;
  window.closeModal(); // important : on ferme la modale pour pouvoir cliquer sur le plateau
};

// appelé quand on clique une case pendant la liquidation
window.handleLiquidationCaseClick = (pos) => {
  const teamIdx = window.liquidationTeamIdx;

  // sécurité
  if (!window.liquidationMode || teamIdx === null) return;
  if (!window.liquidationAwaitPick) return;

  // il faut une entreprise (pas spécial, pas chance, etc.)
  if (boardData[pos].type) {
    window.openModal("⛔ CASE INVALIDE", `
      <p style="font-size:1.4rem;">Choisis une <b>entreprise</b> (une case achetable).</p>
      <button class="btn-action" style="background:#64748b" onclick="window.beginLiquidationPick()">OK</button>
    `);
    return;
  }

  // il faut posséder au moins 1 part sur cette entreprise
  const shares = window.corporateShares[pos];
  const ownedCount = shares.filter(x => x === teamIdx).length;
  if (ownedCount <= 0) {
    window.openModal("⛔ PAS DE PART", `
      <p style="font-size:1.4rem;">Vous ne possédez aucune part sur <b>${boardData[pos].name}</b>.</p>
      <button class="btn-action" style="background:#64748b" onclick="window.beginLiquidationPick()">OK</button>
    `);
    return;
  }

  // OK -> question
  window.liquidationAwaitPick = false;

  const q = ensureQuestionOrPrompt();
  if (!q) { 
    // si pas de questions, on remet le mode sélection
    window.liquidationAwaitPick = true;
    return; 
  }

  window.openModal("💸 LIQUIDATION - QUESTION", `
    <div id="timer-val" class="timer-box">30s</div>
    <p style="font-size:1.2rem;color:#334155;">
      Vente d’1 part de <b>${boardData[pos].name}</b><br>
      Valeur rachat : <b>${Math.floor(boardData[pos].price * 0.5)}€</b> (50%)
    </p>
    <div class="quiz-box">${q}</div>
    <button class="btn-action" style="background:var(--vert)" onclick="window.resolveLiquidation(${teamIdx}, ${pos}, true)">JUSTE ✅</button>
    <button class="btn-action" style="background:var(--rouge)" onclick="window.resolveLiquidation(${teamIdx}, ${pos}, false)">FAUX ❌</button>
  `);

  window.startQTimer(30, () => window.resolveLiquidation(teamIdx, pos, false));
};

window.resolveLiquidation = (teamIdx, pos, success) => {
  clearInterval(window.questionTimer);

  if (!success) {
    // faux -> fin du tour, on sort du mode liquidation
    window.liquidationMode = false;
    window.liquidationTeamIdx = null;
    window.liquidationAwaitPick = false;

    window.openModal("❌ LIQUIDATION ÉCHOUÉE", `
      <p style="font-size:1.5rem;color:#ef4444;font-weight:900;">Mauvaise réponse : fin du tour.</p>
      <button class="btn-action" style="background:#64748b" onclick="window.nextTurn()">OK</button>
    `);
    return;
  }

  // juste -> on vend 1 part à 50%
  const arr = window.corporateShares[pos];
  const idxInArr = arr.indexOf(teamIdx);
  if (idxInArr !== -1) arr.splice(idxInArr, 1);

  const gain = Math.floor(boardData[pos].price * 0.5);
  window.teams[teamIdx].capital += gain;

  window.updateUI();
console.log("Encore en faillite ?", isBankrupt(teamIdx));
console.log("Parts restantes :", teamOwnedPositions(teamIdx).length);
 // encore en faillite ?
if (isBankrupt(teamIdx)) {

  const owned = teamOwnedPositions(teamIdx);

  // 🔥 Plus aucune part → crédit obligatoire
  if (owned.length === 0) {

    window.liquidationMode = false;
    window.liquidationTeamIdx = null;
    window.liquidationAwaitPick = false;

 window.showPedagogicalReport = () => {

  let rows = "";

  Object.keys(window.studentStats || {}).forEach(name => {

    const rate = s.total > 0
      ? Math.round((s.correct / s.total) * 100)
      : 0;

        <td style="padding:8px;border-bottom:1px solid #ddd;">${name}</td>

      </tr>
    `;

  `);
};
  window.downloadPedagogicalPDF = () => {

  if (!window.jspdf) {
    alert("La librairie PDF ne s'est pas chargée.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const today = new Date().toLocaleDateString();

  doc.setFontSize(18);
  doc.text("BILAN PÉDAGOGIQUE", 20, 20);

  doc.setFontSize(12);
  doc.text("Date : " + today, 20, 30);

  let y = 45;

  Object.keys(window.studentStats || {}).forEach(name => {
    const s = window.studentStats[name];
    const rate = s.total > 0
      ? Math.round((s.correct / s.total) * 100)
      : 0;

    doc.text(`${name} - ${s.correct}/${s.total} (${rate}%)`, 20, y);
    y += 10;
  });

  doc.save("Bilan_pedagogique.pdf");
};
